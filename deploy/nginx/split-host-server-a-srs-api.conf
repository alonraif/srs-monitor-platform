# Split-host Server A (SRS host) optional TLS wrapper for SRS API
# Goal: expose SRS API safely to Server B only, over HTTPS.
# Also enforce HTTP basic auth at SRS itself (http_api.auth) or here (or both).

upstream srs_api {
    server 127.0.0.1:1985;
}

server {
    listen 80;
    server_name srs-api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name srs-api.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Network allowlist: only Server B may call SRS API.
    allow 203.0.113.10; # replace with Server B public/private source IP
    deny all;

    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://srs_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }
}
