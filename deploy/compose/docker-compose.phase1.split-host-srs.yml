services:
  srs:
    # Phase 1 on Server A: keep SRS API private to host; do not expose 1985 publicly.
    ports:
      - "${SRS_RTMP_PORT:-1935}:1935"
      - "${SRS_HTTP_PORT:-8080}:8080"
      - "8000:8000/udp"
      - "${SRS_SRT_PORT:-10080}:10080/udp"

  srs-api-proxy:
    build:
      context: ./deploy/nginx/proxy-image
    container_name: srs-api-proxy
    restart: unless-stopped
    depends_on:
      - srs
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/split-host-server-a-srs-api.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs
