services:
  srs:
    # Server A: expose required media ports; keep SRS API private.
    ports:
      - "${SRS_RTMP_PORT:-1935}:1935"
      - "${SRS_HTTP_PORT:-8080}:8080"
      - "8000:8000/udp"
      - "${SRS_SRT_PORT:-10080}:10080/udp"
    command: >-
      /bin/sh -c "sed -e \"s|__SRS_HTTP_API_USERNAME__|$${SRS_HTTP_API_USERNAME}|g\"
      -e \"s|__SRS_HTTP_API_PASSWORD__|$${SRS_HTTP_API_PASSWORD}|g\"
      -e \"s|__SRS_HOOK_ON_PUBLISH_URL__|$${SRS_HOOK_ON_PUBLISH_URL}|g\"
      -e \"s|__SRS_HOOK_ON_PLAY_URL__|$${SRS_HOOK_ON_PLAY_URL}|g\"
      /usr/local/srs/conf/srs.secure.conf.template > /tmp/srs.secure.conf
      && ./objs/srs -c /tmp/srs.secure.conf"
    environment:
      SRS_HTTP_API_USERNAME: "${SRS_HTTP_API_USERNAME:-monitor}"
      SRS_HTTP_API_PASSWORD: "${SRS_HTTP_API_PASSWORD:-change-me-now}"
      SRS_HOOK_ON_PUBLISH_URL: "${SRS_HOOK_ON_PUBLISH_URL:-http://<SERVER_B_IP>:8000/internal/srs/on_publish?secret=dev-hook-secret}"
      SRS_HOOK_ON_PLAY_URL: "${SRS_HOOK_ON_PLAY_URL:-http://<SERVER_B_IP>:8000/internal/srs/on_play?secret=dev-hook-secret}"
    volumes:
      - ./srs/srs.secure.conf.template:/usr/local/srs/conf/srs.secure.conf.template:ro

  srs-api-proxy:
    build:
      context: ./deploy/nginx/proxy-image
    container_name: srs-api-proxy
    restart: unless-stopped
    depends_on:
      - srs
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/split-host-server-a-srs-api.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs
