services:
  srs:
    # Keep required media ports exposed; do not expose SRS API 1985 publicly.
    ports:
      - "${SRS_RTMP_PORT:-1935}:1935"
      - "${SRS_HTTP_PORT:-8080}:8080"
      - "8000:8000/udp"
      - "${SRS_SRT_PORT:-10080}:10080/udp"
    command: >-
      /bin/sh -c "sed -e \"s|__SRS_HTTP_API_USERNAME__|$${SRS_HTTP_API_USERNAME}|g\"
      -e \"s|__SRS_HTTP_API_PASSWORD__|$${SRS_HTTP_API_PASSWORD}|g\"
      -e \"s|__SRS_SRT_PASSPHRASE__|$${SRS_SRT_PASSPHRASE}|g\"
      -e \"s|__SRS_SRT_PBKEYLEN__|$${SRS_SRT_PBKEYLEN}|g\"
      -e \"s|__SRS_HOOK_ON_PUBLISH_URL__|$${SRS_HOOK_ON_PUBLISH_URL}|g\"
      -e \"s|__SRS_HOOK_ON_PLAY_URL__|$${SRS_HOOK_ON_PLAY_URL}|g\"
      -e \"s|__SRS_RTSP_1_ENABLED__|$${SRS_RTSP_1_ENABLED}|g\"
      -e \"s|__SRS_RTSP_1_SOURCE_URL__|$${SRS_RTSP_1_SOURCE_URL}|g\"
      -e \"s|__SRS_RTSP_1_OUTPUT_RTMP_URL__|$${SRS_RTSP_1_OUTPUT_RTMP_URL}|g\"
      -e \"s|__SRS_RTSP_2_ENABLED__|$${SRS_RTSP_2_ENABLED}|g\"
      -e \"s|__SRS_RTSP_2_SOURCE_URL__|$${SRS_RTSP_2_SOURCE_URL}|g\"
      -e \"s|__SRS_RTSP_2_OUTPUT_RTMP_URL__|$${SRS_RTSP_2_OUTPUT_RTMP_URL}|g\"
      -e \"s|__SRS_RTSP_3_ENABLED__|$${SRS_RTSP_3_ENABLED}|g\"
      -e \"s|__SRS_RTSP_3_SOURCE_URL__|$${SRS_RTSP_3_SOURCE_URL}|g\"
      -e \"s|__SRS_RTSP_3_OUTPUT_RTMP_URL__|$${SRS_RTSP_3_OUTPUT_RTMP_URL}|g\"
      -e \"s|__SRS_RTSP_4_ENABLED__|$${SRS_RTSP_4_ENABLED}|g\"
      -e \"s|__SRS_RTSP_4_SOURCE_URL__|$${SRS_RTSP_4_SOURCE_URL}|g\"
      -e \"s|__SRS_RTSP_4_OUTPUT_RTMP_URL__|$${SRS_RTSP_4_OUTPUT_RTMP_URL}|g\"
      /usr/local/srs/conf/srs.secure.conf.template > /tmp/srs.secure.conf
      && ./objs/srs -c /tmp/srs.secure.conf"
    environment:
      SRS_HTTP_API_USERNAME: "${SRS_HTTP_API_USERNAME:-monitor}"
      SRS_HTTP_API_PASSWORD: "${SRS_HTTP_API_PASSWORD:-change-me-now}"
      SRS_SRT_PASSPHRASE: "${SRS_SRT_PASSPHRASE:-change-me-srt-passphrase}"
      SRS_SRT_PBKEYLEN: "${SRS_SRT_PBKEYLEN:-16}"
      SRS_HOOK_ON_PUBLISH_URL: "${SRS_HOOK_ON_PUBLISH_URL:-http://monitor-backend:8000/internal/srs/on_publish?secret=dev-hook-secret}"
      SRS_HOOK_ON_PLAY_URL: "${SRS_HOOK_ON_PLAY_URL:-http://monitor-backend:8000/internal/srs/on_play?secret=dev-hook-secret}"
      SRS_RTSP_1_ENABLED: "${SRS_RTSP_1_ENABLED:-off}"
      SRS_RTSP_1_SOURCE_URL: "${SRS_RTSP_1_SOURCE_URL:-rtsp://user:password@camera-ip:554/stream1}"
      SRS_RTSP_1_OUTPUT_RTMP_URL: "${SRS_RTSP_1_OUTPUT_RTMP_URL:-rtmp://127.0.0.1/live/camera-1}"
      SRS_RTSP_2_ENABLED: "${SRS_RTSP_2_ENABLED:-off}"
      SRS_RTSP_2_SOURCE_URL: "${SRS_RTSP_2_SOURCE_URL:-rtsp://user:password@camera-ip:554/stream2}"
      SRS_RTSP_2_OUTPUT_RTMP_URL: "${SRS_RTSP_2_OUTPUT_RTMP_URL:-rtmp://127.0.0.1/live/camera-2}"
      SRS_RTSP_3_ENABLED: "${SRS_RTSP_3_ENABLED:-off}"
      SRS_RTSP_3_SOURCE_URL: "${SRS_RTSP_3_SOURCE_URL:-rtsp://user:password@camera-ip:554/stream3}"
      SRS_RTSP_3_OUTPUT_RTMP_URL: "${SRS_RTSP_3_OUTPUT_RTMP_URL:-rtmp://127.0.0.1/live/camera-3}"
      SRS_RTSP_4_ENABLED: "${SRS_RTSP_4_ENABLED:-off}"
      SRS_RTSP_4_SOURCE_URL: "${SRS_RTSP_4_SOURCE_URL:-rtsp://user:password@camera-ip:554/stream4}"
      SRS_RTSP_4_OUTPUT_RTMP_URL: "${SRS_RTSP_4_OUTPUT_RTMP_URL:-rtmp://127.0.0.1/live/camera-4}"
    volumes:
      - ./srs/srs.secure.conf.template:/usr/local/srs/conf/srs.secure.conf.template:ro

  monitor-backend:
    ports: []
    environment:
      SRS_API_USERNAME: "${SRS_HTTP_API_USERNAME:-monitor}"
      SRS_API_PASSWORD: "${SRS_HTTP_API_PASSWORD:-change-me-now}"
      SRS_HOOK_SHARED_SECRET: "${SRS_HOOK_SHARED_SECRET:-dev-hook-secret}"
      STREAM_AUTH_ENFORCE: "${STREAM_AUTH_ENFORCE:-false}"
      STREAM_AUTH_SECRET: "${STREAM_AUTH_SECRET:-change-stream-auth-secret}"
      STREAM_AUTH_CLOCK_SKEW_SECONDS: "${STREAM_AUTH_CLOCK_SKEW_SECONDS:-60}"
      CORS_ALLOW_ORIGIN_REGEX: "${CORS_ALLOW_ORIGIN_REGEX:-}"

  monitor-ui:
    ports: []

  preview-service:
    ports: []

  reverse-proxy:
    build:
      context: ./deploy/nginx/proxy-image
    container_name: reverse-proxy
    restart: unless-stopped
    depends_on:
      - monitor-ui
      - monitor-backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/single-host.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs
