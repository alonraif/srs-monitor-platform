services:
  srs:
    # Phase 1: keep media ports exposed as needed; do not expose SRS API 1985.
    ports:
      - "${SRS_RTMP_PORT:-1935}:1935"
      - "${SRS_HTTP_PORT:-8080}:8080"
      - "8000:8000/udp"
      - "${SRS_SRT_PORT:-10080}:10080/udp"

  monitor-backend:
    # Phase 1: backend is internal-only; proxy is the public entrypoint.
    ports: []

  monitor-ui:
    # Phase 1: UI is internal-only; proxy serves public traffic.
    ports: []

  preview-service:
    # Phase 1: preview-service is internal-only.
    ports: []

  reverse-proxy:
    build:
      context: ./deploy/nginx/proxy-image
    container_name: reverse-proxy
    restart: unless-stopped
    depends_on:
      - monitor-ui
      - monitor-backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/single-host.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs
