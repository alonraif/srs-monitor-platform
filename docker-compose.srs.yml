services:
  srs:
    image: ossrs/srs:6
    container_name: srs
    restart: unless-stopped
    command: ./objs/srs -c /usr/local/srs/conf/srs.conf
    ports:
      - "${SRS_RTMP_PORT:-1935}:1935"
      - "${SRS_HTTP_PORT:-8080}:8080"
      - "${SRS_API_PORT:-1985}:1985"
      - "${SRS_RTC_PORT:-8000}:8000/udp"
      - "${SRS_SRT_PORT:-10080}:10080/udp"
    volumes:
      - ./srs/srs.conf:/usr/local/srs/conf/srs.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1985/api/v1/summaries"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
