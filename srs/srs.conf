listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

srt_server {
    enabled         on;
    listen          10080;
    tsbpdmode       on;
    latency         200;
    recvlatency     200;
    peerlatency     200;
    tlpkdrop        on;
}

rtc_server {
    enabled         on;
    listen          8000;
    candidate       172.16.32.52;
}

stats {
    network         0;
    disk            sda sdb xvda xvdb;
}

vhost __defaultVhost__ {
    # Path A: SRT ingest converted to RTMP pipeline.
    srt {
        enabled     on;
        srt_to_rtmp on;
    }

    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    hls {
        enabled     on;
        hls_fragment 4;
        hls_window   20;
    }

    rtc {
        enabled     on;
        rtmp_to_rtc on;
        rtc_to_rtmp on;
    }
}

vhost ab_rtmp_direct {
    # Path B: direct RTMP ingest (no SRT->RTMP conversion path involved).
    srt {
        enabled     off;
        srt_to_rtmp off;
    }

    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    hls {
        enabled     on;
        hls_fragment 4;
        hls_window   20;
    }

    rtc {
        enabled     on;
        rtmp_to_rtc on;
        rtc_to_rtmp on;
    }
}
