services:
  monitor-backend:
    build:
      context: ./backend
    container_name: monitor-backend
    restart: unless-stopped
    environment:
      MOCK_MODE: "${MOCK_MODE:-true}"
      SRS_API_URL: "${SRS_API_URL:-http://localhost:1985}"
      SRS_API_TIMEOUT_SECONDS: "${SRS_API_TIMEOUT_SECONDS:-2.5}"
      SRS_PUBLIC_HTTP_BASE_URL: "${SRS_PUBLIC_HTTP_BASE_URL:-http://localhost:8080}"
      SRS_INTERNAL_HTTP_BASE_URL: "${SRS_INTERNAL_HTTP_BASE_URL:-http://localhost:8080}"
      SRS_PUBLIC_WEBRTC_BASE_URL: "${SRS_PUBLIC_WEBRTC_BASE_URL:-webrtc://localhost}"
      PREVIEW_PREFERRED_PROTOCOL: "${PREVIEW_PREFERRED_PROTOCOL:-webrtc}"
      PREVIEW_FORCE_REWRAP: "${PREVIEW_FORCE_REWRAP:-false}"
      PREVIEW_PUBLIC_BASE_URL: "${PREVIEW_PUBLIC_BASE_URL:-http://localhost:8001}"
      PREVIEW_SERVICE_URL: "${PREVIEW_SERVICE_URL:-http://preview-service:8001}"
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
      CORS_ALLOW_ORIGIN_REGEX: "${CORS_ALLOW_ORIGIN_REGEX:-^https?://(localhost|127\\.0\\.0\\.1|10\\.\\d+\\.\\d+\\.\\d+|172\\.(1[6-9]|2\\d|3[0-1])\\.\\d+\\.\\d+|192\\.168\\.\\d+\\.\\d+)(:\\d+)?$}"
      SQLITE_PATH: "${SQLITE_PATH:-/data/monitor.db}"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - monitor_backend_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  monitor-ui:
    build:
      context: ./frontend
    container_name: monitor-ui
    restart: unless-stopped
    environment:
      VITE_BACKEND_API_URL: "${VITE_BACKEND_API_URL:-}"
      VITE_SRS_RTMP_PORT: "${VITE_SRS_RTMP_PORT:-1935}"
      VITE_SRS_SRT_PORT: "${VITE_SRS_SRT_PORT:-10080}"
      VITE_SRS_PUBLIC_HTTP_BASE_URL: "${VITE_SRS_PUBLIC_HTTP_BASE_URL:-http://localhost:8080}"
      VITE_SRS_PUBLIC_WEBRTC_BASE_URL: "${VITE_SRS_PUBLIC_WEBRTC_BASE_URL:-webrtc://localhost}"
      VITE_SRS_WEBRTC_API_BASE_URL: "${VITE_SRS_WEBRTC_API_BASE_URL:-http://localhost:1985}"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - monitor-backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  preview-service:
    build:
      context: ./preview-service
    container_name: preview-service
    restart: unless-stopped
    environment:
      SRS_API_URL: "${SRS_API_URL:-http://localhost:1985}"
    ports:
      - "${PREVIEW_PORT:-8001}:8001"
    volumes:
      - preview_data:/var/preview
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    profiles:
      - monitoring
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    profiles:
      - monitoring
    privileged: true
    ports:
      - "${CADVISOR_PORT:-8081}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

volumes:
  monitor_backend_data:
  preview_data:
